# Render Blueprint for the API. Create it from the dashboard: New > Blueprint > this repository.
# Values marked "sync: false" are prompted for on first deploy (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: easybuy-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      # The free instance has 512 MB of memory
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
      # Render generates a random base64-encoded 256-bit value on first deploy
      - key: JWT_SECRET_KEY
        generateValue: true

      # Neon PostgreSQL: use the direct (non-pooler) host
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGSSLMODE
        value: require

      # Storefront (Vercel) URL, without a trailing slash
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STOREFRONT_URL
        sync: false
      - key: ACTIVATE_ACCOUNT_URL
        sync: false

      # Brevo SMTP relay
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SMTP_AUTH
        value: "true"
      - key: EMAIL_STARTTLS
        value: "true"
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SENDER_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # BCrypt hash of a private password for the seeded staff account
      - key: DEMO_STAFF_PASSWORD_HASH
        sync: false
