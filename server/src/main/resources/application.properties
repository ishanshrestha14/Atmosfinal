spring.application.name=ecommerce_app

# Hosting platforms such as Render inject PORT
server.port=${PORT:8080}

# Every value below can be overridden with an environment variable.
# Defaults match docker-compose.yml so the app runs locally with zero setup.

# PostgreSQL connection details
# PGSSLMODE=require for managed databases such as Neon
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecommerce}?sslmode=${PGSSLMODE:prefer}
spring.datasource.username=${PGUSER:ecommerce}
spring.datasource.password=${PGPASSWORD:ecommerce}

# Schema is owned by Flyway migrations (db/migration); Hibernate only verifies the mapping matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway: db/seed adds demo data (roles, catalogue, demo users); production sets FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
# Databases created by the old ddl-auto setup already match V1, so they are baselined there rather than migrated
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# BCrypt hash for the seeded staff account. The default is the documented local password (Staff1234!);
# a public deployment must set its own, or anyone could sign in as staff
spring.flyway.placeholders[demo_staff_password_hash]=${DEMO_STAFF_PASSWORD_HASH:$2y$10$APGM7UT5eOMgYQurvtpBcuoxWXJpcycQnvFnHkIDMK4qDhR.uyuZe}

# Health: email is best effort, so an SMTP outage must not mark the API as down
management.health.mail.enabled=false

# Absolute storefront URL, used for links and images in emails
app.storefront-url=${STOREFRONT_URL:http://localhost:3000}

# Logging
logging.level.root=INFO
logging.pattern.file="%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
logging.file.name=loggs/app.log

# JWT Token config (secret must be Base64-encoded, at least 256 bits; expirations in ms)
jwt.secret-key=${JWT_SECRET_KEY:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_EXPIRATION_REFRESH:604800000}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Email sender (defaults point at the Mailpit container: http://localhost:8025)
spring.mail.host=${EMAIL_HOST:localhost}
spring.mail.port=${EMAIL_PORT:1025}
spring.mail.username=${EMAIL_SENDER:no-reply@atmos.local}
spring.mail.password=${EMAIL_SENDER_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_STARTTLS:false}
# Sender address; providers such as Brevo only relay mail from verified senders
app.mail.from=${EMAIL_FROM:no-reply@atmos.local}

# Activating account
activation-code-length = 5
mailing.url=${ACTIVATE_ACCOUNT_URL:http://localhost:3000}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
